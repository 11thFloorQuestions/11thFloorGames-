<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eleventh Floor Games Lobby</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #222222;
            --surface-border-light: #333333;
            --accent-red: #ff1f2d;
            --accent-red-glow: rgba(255, 31, 45, 0.25);
            --accent-green: #22c55e;
            --accent-green-glow: rgba(34, 197, 94, 0.3);
            --text-primary: #ffffff;
            --text-muted: #888888;

            /* Specific Game Genre Colors & Glows */
            --color-terrace: #84CC16;
            --color-terrace-glow: rgba(132, 204, 22, 0.35);
            --color-questions: #D4AF37;
            --color-questions-glow: rgba(212, 175, 55, 0.35);
            --color-wordclimb: #3B82F6;
            --color-wordclimb-glow: rgba(59, 130, 246, 0.3);
            --color-clusters: #ff751f;
            --color-clusters-glow: rgba(255, 117, 31, 0.35);
            --color-cluegram: #cc007e;
            --color-cluegram-glow: rgba(204, 0, 126, 0.35);
            --color-parity: #ff9999;
            --color-parity-glow: rgba(255, 153, 153, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 16px;
            overflow-x: hidden;
        }

        /* Scaled-down Logo Box */
        .hub-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
        }

        .hub-logo-red {
            font-family: 'Anton', sans-serif;
            font-size: 4.2rem;
            font-weight: 400;
            color: var(--accent-red);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 31, 45, 0.35);
            margin-bottom: 4px;
            animation: logoColorCycle 2.6s ease-in-out forwards;
        }

        .hub-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .hub-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Standardized 52px Animated Building Graphic */
        .hub-shaft-graphic {
            display: flex;
            flex-direction: column;
            width: 52px;
            height: 140px;
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 6px;
            gap: 3px;
            background-color: var(--surface);
            margin-bottom: 16px;
        }

        .shaft-box {
            flex: 1;
            background-color: #111111;
            border: 1px solid var(--surface-border);
            border-radius: 2px;
            animation: sweepMiddle 1.2s ease-in-out forwards;
        }

        /* Sequential Upward Light Sweep + Top Green Hold + Drop to Floor 01 */
        .hub-shaft-graphic .shaft-box:nth-child(11) { animation: sweepBottomSettle 2.6s ease-in-out forwards; animation-delay: 0.05s; }
        .hub-shaft-graphic .shaft-box:nth-child(10) { animation-delay: 0.15s; }
        .hub-shaft-graphic .shaft-box:nth-child(9)  { animation-delay: 0.25s; }
        .hub-shaft-graphic .shaft-box:nth-child(8)  { animation-delay: 0.35s; }
        .hub-shaft-graphic .shaft-box:nth-child(7)  { animation-delay: 0.45s; }
        .hub-shaft-graphic .shaft-box:nth-child(6)  { animation-delay: 0.55s; }
        .hub-shaft-graphic .shaft-box:nth-child(5)  { animation-delay: 0.65s; }
        .hub-shaft-graphic .shaft-box:nth-child(4)  { animation-delay: 0.75s; }
        .hub-shaft-graphic .shaft-box:nth-child(3)  { animation-delay: 0.85s; }
        .hub-shaft-graphic .shaft-box:nth-child(2)  { animation-delay: 0.95s; }
        .hub-shaft-graphic .shaft-box:nth-child(1)  { animation: sweepTopGreen 1.6s ease-in-out forwards; animation-delay: 1.05s; }

        @keyframes logoColorCycle {
            0% {
                color: var(--accent-red);
                text-shadow: 0 0 20px rgba(255, 31, 45, 0.35
