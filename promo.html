<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor — Victory Card Sandbox</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="apple-touch-icon" href="favicon.svg?v=2">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="sandbox-container">

        <!-- THE RECEIPT CARD CONTAINER -->
        <div class="victory-receipt-card" id="victory-card">
            
            <div class="receipt-header">
                <!-- TWO-COLUMN BRAND LOCKUP -->
                <div class="brand-lockup-container">
                    <span class="brand-mark-left">11FL?</span>
                    <div class="brand-text-stacked">
                        <span class="brand-title-top">Eleventh Floor</span>
                        <span class="brand-title-bottom">GAMES</span>
                    </div>
                </div>

                <span class="badge-slot-reserved">[BADGE AREA]</span>
            </div>

            <div class="hero-flex-box">
                <div class="game-title-header">THINK YOU KNOW BALL?</div>
                
                <div class="flex-status-label">
                    <span class="brand-green">11th</span> <span class="brand-white">Floor Reached</span>
                </div>

                <div class="hero-time-display" id="display-time">00:44</div>
                
                <div class="flex-tier-badge" id="flex-tier-msg">EXPERT</div>
            </div>

            <div class="receipt-details">
                <div class="receipt-row">
                    <span class="row-label">Accuracy</span>
                    <span class="row-val success">100% (10/10)</span>
                </div>
                <div class="receipt-row">
                    <span class="row-label">Active Streak</span>
                    <span class="row-val active">1 Day</span>
                </div>
            </div>

            <div class="card-footer-cta">
                SEARCH: THINK YOU KNOW BALL?
            </div>

        </div>

        <!-- SHARING CONTROLS -->
        <div class="controls-group">
            <button class="btn-flex-action" id="btn-copy-flex">SHARE</button>
            <button class="btn-secondary-action" id="btn-stats-vault">VIEW STATS & ARCHIVES</button>
        </div>

    </div>

    <div id="toast-msg">COPIED TO CLIPBOARD</div>

    <script>
        function getTierRank(totalSeconds) {
            if (totalSeconds < 50) return "EXPERT";
            if (totalSeconds <= 65) return "PUNDIT LEVEL";
            return "I KNOW BALL";
        }

        const sampleSeconds = 44;
        const formattedTime = "00:44";
        const calculatedRank = getTierRank(sampleSeconds);

        document.getElementById('display-time').textContent = formattedTime;
        document.getElementById('flex-tier-msg').textContent = calculatedRank;

        document.getElementById('btn-copy-flex').addEventListener('click', () => {
            const flexText = 
`11th Floor: Think You Know Ball?
11th Floor Reached
Time: ${formattedTime} | ${calculatedRank}
Streak: 1 Day

Prove you know ball:
https://11thfloorquestions.vercel.app/ball.html`;

            navigator.clipboard.writeText(flexText).then(() => {
                const toast = document.getElementById('toast-msg');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2000);
            });
        });
    </script>

</body>
</html>
