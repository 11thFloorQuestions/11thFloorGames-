<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11th Floor Games — Speedrun Promo</title>
  <style>
    :root {
      --bg-dark: #0B0E14;
      --card-bg: #161B22;
      --border-color: #21262D;
      --text-main: #F0F6FC;
      --text-muted: #8B949E;
      --accent-gold: #D29922;
      --active-accent: #58A6FF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: #010409;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 9:16 Vertical Screen Frame */
    .phone-container {
      width: 100vw;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Persistent Speedrun HUD */
    .promo-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: rgba(22, 27, 34, 0.95);
      border-bottom: 2px solid var(--active-accent);
      z-index: 10;
      transition: border-color 0.3s ease;
    }

    .hud-badge {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--border-color);
      color: var(--text-main);
    }

    .hud-timer {
      font-family: monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    /* Controls Bar for Recording Setup */
    .rec-bar {
      position: absolute;
      top: 60px;
      right: 12px;
      z-index: 100;
      display: flex;
      gap: 6px;
    }

    .rec-btn {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Game Stage Display */
    .game-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .game-title {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .game-prompt {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      line-height: 1.3;
    }

    /* Grid Options / Taps */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .opt-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .opt-card.correct-flash {
      background: rgba(46, 160, 67, 0.3) !important;
      border-color: #3fb950 !important;
      color: #3fb950 !important;
      transform: scale(0.98);
    }

    /* Victory Screen Overlay */
    .victory-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px;
      background: radial-gradient(circle at center, #1C1917 0%, #0B0E14 100%);
      animation: fadeIn 0.5s ease forwards;
    }

    .victory-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }

    .victory-time-box {
      background: var(--card-bg);
      border: 1px solid var(--accent-gold);
      padding: 16px 32px;
      border-radius: 12px;
      margin: 16px 0;
      text-align: center;
    }

    .victory-time-box h3 {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .victory-time-box div {
      font-family: monospace;
      font-size: 32px;
      color: #FFF;
      font-weight: bold;
    }

    .copy-brag-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-gold);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      margin-top: 16px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="phone-container">
  <!-- Dynamic HUD -->
  <div class="promo-hud" id="hud">
    <div>
      <span class="hud-badge" id="hudGame">Questions</span>
      <span style="font-size: 12px; margin-left: 6px; color: var(--text-muted);" id="hudFloor">FLOOR 1/11</span>
    </div>
    <div class="hud-timer" id="hudTimer">00:00.00</div>
  </div>

  <!-- Manual Screen Record Control Bar -->
  <div class="rec-bar">
    <button class="rec-btn" onclick="startAutoRun()">▶ Run Demo</button>
    <button class="rec-btn" onclick="resetDemo()">↻ Reset</button>
  </div>

  <!-- Interactive Demo Stage -->
  <div class="game-stage" id="stage">
    <div class="game-title" id="stageGameTitle">11th Floor Questions</div>
    <div class="game-prompt" id="stagePrompt">Which chemical element has the symbol 'Fe'?</div>
    
    <div class="options-grid" id="stageOptions">
      <div class="opt-card" onclick="triggerCorrect(this, 0)">Iron</div>
      <div class="opt-card">Copper</div>
      <div class="opt-card">Lead</div>
      <div class="opt-card">Silver</div>
    </div>
  </div>

  <!-- Final Brag Screen Overlay -->
  <div class="victory-screen" id="victoryScreen">
    <div style="font-size: 40px; margin-bottom: 8px;">🏆</div>
    <div class="victory-title">11th Floor Reached!</div>
    <p style="color: var(--text-muted); font-size: 14px;">All 6 Daily Micro-Games Cleared</p>
    
    <div class="victory-time-box">
      <h3>Official Clear Time</h3>
      <div id="finalTimeDisplay">00:48.32</div>
    </div>

    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
      🟢 Questions | 🔴 Ball | 🟣 Word Climb<br>🟢 Parity | 🟠 Clusters | 🟡 Cluegram
    </div>

    <button class="copy-brag-btn" id="bragBtn" onclick="copyBragText()">📋 Copy Brag Stats</button>
  </div>
</div>

<script>
  let startTime = null;
  let timerInterval = null;
  let currentStep = 0;

  const demoSteps = [
    {
      game: "Questions",
      accent: "#58A6FF",
      floor: "FLOOR 1/11",
      title: "11th Floor Questions",
      prompt: "Which element has the symbol 'Fe'?",
      options: ["Iron", "Copper", "Lead", "Silver"],
      correctIndex: 0
    },
    {
      game: "Think You Know Ball?",
      accent: "#DA3633",
      floor: "FLOOR 3/11",
      title: "Think You Know Ball?",
      prompt: "Who won the Premier League Golden Boot in 2022/23?",
      options: ["Erling Haaland", "Harry Kane", "Mohamed Salah", "Marcus Rashford"],
      correctIndex: 0
    },
    {
      game: "Word Climb",
      accent: "#A371F7",
      floor: "FLOOR 5/11",
      title: "11th Floor Word Climb",
      prompt: "Target Length: 9 Letters",
      options: ["ELEVATION", "ELEVATOR", "VALENTINE", "VERTICAL"],
      correctIndex: 0
    },
    {
      game: "Parity",
      accent: "#3FB950",
      floor: "FLOOR 7/11",
      title: "11th Floor Parity",
      prompt: "Find the odd pattern out:",
      options: ["Pattern A", "Pattern B (Odd)", "Pattern C", "Pattern D"],
      correctIndex: 1
    },
    {
      game: "Clusters",
      accent: "#F0883E",
      floor: "FLOOR 9/11",
      title: "11th Floor Clusters",
      prompt: "Group 4: British Game Shows",
      options: ["Only Connect", "Wordle", "Chess", "Scrabble"],
      correctIndex: 0
    },
    {
      game: "Cluegram",
      accent: "#D29922",
      floor: "FLOOR 11/11",
      title: "11th Floor Cluegram",
      prompt: "Final Cryptic Clue: 'Top Floor Victory'",
      options: ["SKYSCRAPER", "ELEVATOR", "PENTHOUSE", "VICTORY"],
      correctIndex: 0
    }
  ];

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    startTime = performance.now();
    timerInterval = setInterval(() => {
      const elapsed = performance.now() - startTime;
      const secs = Math.floor(elapsed / 1000);
      const ms = Math.floor((elapsed % 1000) / 10);
      const formatted = String(secs).padStart(2, '0') + ':' + String(ms).padStart(2, '0');
      document.getElementById('hudTimer').innerText = '00:' + formatted;
    }, 10);
  }

  function loadStep(index) {
    if (index >= demoSteps.length) {
      finishRun();
      return;
    }

    const step = demoSteps[index];
    document.getElementById('hudGame').innerText = step.game;
    document.getElementById('hudFloor').innerText = step.floor;
    document.getElementById('hud').style.borderColor = step.accent;
    
    document.getElementById('stageGameTitle').innerText = step.title;
    document.getElementById('stagePrompt').innerText = step.prompt;

    const optGrid = document.getElementById('stageOptions');
    optGrid.innerHTML = '';

    step.options.forEach((optText, idx) => {
      const div = document.createElement('div');
      div.className = 'opt-card';
      div.innerText = optText;
      div.onclick = () => triggerCorrect(div, idx === step.correctIndex);
      optGrid.appendChild(div);
    });
  }

  function triggerCorrect(element, isCorrect) {
    element.classList.add('correct-flash');
    setTimeout(() => {
      currentStep++;
      loadStep(currentStep);
    }, 400);
  }

  function startAutoRun() {
    resetDemo();
    startTimer();

    let delay = 300;
    demoSteps.forEach((_, idx) => {
      setTimeout(() => {
        const opts = document.querySelectorAll('.opt-card');
        const correctIdx = demoSteps[idx].correctIndex;
        if (opts[correctIdx]) {
          triggerCorrect(opts[correctIdx], true);
        }
      }, delay);
      delay += 1400; // Step through every 1.4 seconds for crisp speedrun pacing
    });
  }

  function finishRun() {
    clearInterval(timerInterval);
    const finalTime = document.getElementById('hudTimer').innerText;
    document.getElementById('finalTimeDisplay').innerText = finalTime;
    document.getElementById('stage').style.display = 'none';
    document.getElementById('victoryScreen').style.display = 'flex';
  }

  function copyBragText() {
    const btn = document.getElementById('bragBtn');
    btn.innerText = "✓ Copied to Clipboard!";
    btn.style.background = "#3FB950";
    btn.style.color = "#FFF";
  }

  function resetDemo() {
    clearInterval(timerInterval);
    currentStep = 0;
    document.getElementById('hudTimer').innerText = '00:00.00';
    document.getElementById('stage').style.display = 'flex';
    document.getElementById('victoryScreen').style.display = 'none';
    loadStep(0);
  }

  loadStep(0);
</script>
</body>
</html>
