<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor — Victory Card Sandbox</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800;900&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-card: #111111;
            --surface-border: #222222;
            --surface-border-light: #333333;
            --text-primary: #ffffff;
            --text-muted: #888888;
            --genre-pitch: #22c55e;
            --genre-pitch-glow: rgba(34, 197, 94, 0.35);
            --state-active: #facc15;
            --state-success: #22c55e;
            --state-error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            overflow-x: hidden;
        }

        .sandbox-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Branding Header */
        .game-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .game-logo-pitch {
            font-family: 'Anton', sans-serif;
            font-size: 3rem;
            color: var(--genre-pitch);
            line-height: 0.85;
            text-shadow: 0 0 20px var(--genre-pitch-glow);
            margin-bottom: 4px;
        }

        .game-logo-title {
            font-size: 0.9rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
        }

        .game-logo-sub {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--genre-pitch);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* THE VICTORY RECEIPT CARD (THE HERO SHARE CONTAINER) */
        .victory-receipt-card {
