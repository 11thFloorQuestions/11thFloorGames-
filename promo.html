<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Think You Know Ball? — Skyscraper Matchday Drop</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- HTML2CANVAS LIBRARY FOR RECEIPT SCREENSHOT CAPTURE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #222222;
            --surface-border-light: #333333;
            --text-primary: #ffffff;
            --text-muted: #888888;
            --genre-pitch: #22c55e;
            --genre-pitch-glow: rgba(34, 197, 94, 0.35);
            --brand-red: #cc0000;
            --brand-red-glow: rgba(204, 0, 0, 0.35);
            --state-active: #facc15;
            --state-success: #22c55e;
            --state-error: #ef4444;
            --state-error-glow: rgba(239, 68, 68, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 10px;
            overflow-x: hidden;
        }

        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--genre-pitch);
            color: var(--genre-pitch);
        }

        .header-timer {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--state-active);
            letter-spacing: 1px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 4px 12px;
            border-radius: 12px;
            display: none;
        }

        .game-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
            text-align: center;
            flex-shrink: 0;
        }

        .gameplay-header-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
            text-align: center;
            flex-shrink: 0;
        }

        .game-logo-pitch {
            font-family: 'Anton', sans-serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--genre-pitch);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px var(--genre-pitch-glow);
            margin-bottom: 4px;
        }

        .game-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .game-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--genre-pitch);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            padding: 20px 16px;
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            margin-top: 6px;
        }

        /* MODE SELECTOR CARD */
        .mode-selector-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-deep);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 12px;
        }

        .mode-option-btn {
            width: 100%;
            background: #111111;
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .mode-option-btn.active {
            border-color: var(--genre-pitch);
            background: rgba(34, 197, 94, 0.1);
            color: var(--genre-pitch);
        }

        .mode-desc {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .btn-start {
            background-color: var(--surface);
            border: 1px solid var(--genre-pitch);
            color: var(--genre-pitch);
            padding: 12px 28px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--genre-pitch-glow);
            transition: border-color 0.2s ease;
        }

        .hud-sidebar-container { width: 100%; max-width: 600px; display: flex; align-items: stretch; gap: 12px; margin-bottom: 6px; flex-shrink: 0; }
        .floor-info-box { flex-grow: 1; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 8px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }

        .play-card { width: 100%; max-width: 600px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 8px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px; flex-grow: 1; margin-bottom: 6px; overflow: hidden; min-height: 0; }
        
        .question-box { width: 100%; background: #111111; border: 1px solid var(--surface-border); border-radius: 6px; padding: 14px; text-align: center; }
        
        /* MASKED QUESTION STATE (GROUP PLAY) */
        .question-box.masked {
            background: repeating-linear-gradient(45deg, #0a0a0a, #0a0a0a 10px, #111111 10px, #111111 20px);
            border: 1px dashed var(--genre-pitch);
        }

        /* GAFFER FACT BANTER BOX */
        .gaffer-fact-box {
            width: 100%;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid var(--genre-pitch);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 0.75rem;
            color: var(--genre-pitch);
            text-align: left;
            display: none;
        }

        .options-grid { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
        .btn-option { width: 100%; background: #111111; border: 1px solid var(--surface-border-light); border-radius: 8px; padding: 12px 14px; font-family: 'Montserrat', sans-serif; font-size: 0.82rem; font-weight: 600; color: var(--text-primary); text-align: left; cursor: pointer; }
        .btn-option.selected-correct { background: rgba(34, 197, 94, 0.2); border-color: var(--genre-pitch); color: var(--genre-pitch); }
        .btn-option.selected-wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--state-error); color: var(--state-error); }

        /* IN-GAME VICTORY RECEIPT CARD */
        .victory-receipt-card {
            width: 100%;
            max-width: 340px;
            background-color: #111111;
            border: 1px solid var(--genre-pitch);
            border-radius: 14px;
            padding: 22px 20px;
            box-shadow: 0 0 25px var(--genre-pitch-glow);
            margin-bottom: 16px;
            text-align: left;
            display: block;
        }

        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333333;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .brand-lockup-container { display: flex; align-items: center; gap: 8px; }
