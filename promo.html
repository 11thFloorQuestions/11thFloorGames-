        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

        html {
            background-color: #000000;

        body {
            background-color: #000000;

            padding: 20px 14px;

        .sandbox-container {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            display: block;
        }

        /* VICTORY RECEIPT CARD */
        .victory-receipt-card {
            width: 100%;
            background-color: #111111;
            border: 1px solid #22c55e;
            border-radius: 14px;
            padding: 22px 20px;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.35);
            margin-bottom: 16px;
            display: block;
        }

        /* Top Header Logo Bar */
        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333333;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        /* Brand Lockup */

            display: flex;
            align-items: center;

        }
