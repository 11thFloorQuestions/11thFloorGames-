<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>11th Floor Questions — Victory Card Sandbox</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="apple-touch-icon" href="favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .sandbox-container {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            display: block;
        }

        /* VICTORY RECEIPT CARD — GOLD GENRE THEME */
        .victory-receipt-card {
            width: 100%;
            background-color: #111111;
            border: 1px solid #facc15;
            border-radius: 14px;
            padding: 22px 20px;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.35);
            margin-bottom: 16px;
            display: block;
        }

        /* Top Header Logo Bar */
        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333333;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        /* Brand Lockup */
        .brand-lockup-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-mark-left {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: #facc15;
            line-height: 0.85;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.35);
        }

        .brand-text-stacked {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
        }

        .brand-title-top {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .brand-title-bottom {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            color: #facc15;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .badge-slot-reserved {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: #888888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Hero Content Section */
        .hero-flex-box {
            text-align: center;
            padding: 4px 0;
            margin-bottom: 16px;
        }

        .game-title-header {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 6px;
        }

        .flex-status-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .brand-gold { color: #facc15; }
        .brand-green { color: #22c55e; }
        .brand-white { color: #ffffff; }

        .hero-time-display {
            font-family: 'Anton', sans-serif;
            font-size: 3.4rem;
            line-height: 0.9;
            color: #ffffff;
            letter-spacing: 2px;
            margin: 8px 0;
        }

        .hero-time-unit {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #888888;
            letter-spacing: 1px;
            margin-left: 2px;
            text-transform: lowercase;
        }

        .flex-tier-badge {
            display: inline-block;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            color: #facc15;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(250, 204, 21, 0.1);
            border: 1px solid #facc15;
            padding: 6px 16px;
            border-radius: 12px;
            margin-top: 6px;
        }

        /* Metric Rows */
        .receipt-details {
            border-top: 1px solid #333333;
            padding-top: 14px;
            margin-bottom: 16px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .receipt-row:last-child {
            margin-bottom: 0;
        }

        .row-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .row-val {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .row-val.success { color: #22c55e; }
        .row-val.active { color: #facc15; }

        .card-footer-cta {
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 800;
            color: #888888;
            letter-spacing: 1.5px;
            border-top: 1px dashed #333333;
            padding-top: 10px;
            text-transform: uppercase;
        }

        /* BUTTON CONTROLS */
        .controls-group {
            width: 100%;
            display: block;
        }

            width: 100%;

            color: #000000;
