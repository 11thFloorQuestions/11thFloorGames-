<html lang="en">
<head>

    <title>11th Floor — Victory Card Sandbox</title>

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: #000000;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            padding: 20px 14px;
            display: block;
        }

        .sandbox-container {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            display: block;
        }

        /* VICTORY RECEIPT CARD */
        .victory-receipt-card {
            width: 100%;
            background-color: #111111;
            border: 1px solid #22c55e;
            border-radius: 14px;
            padding: 22px 20px;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.35);
            margin-bottom: 16px;
            display: block;
        }

        /* Top Header Logo Bar */
        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333333;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        /* Brand Lockup */
        .brand-lockup-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-mark-left {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: #dc2626;
            line-height: 0.85;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.35);
        }

        .brand-text-stacked {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
        }

        .brand-title-top {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .brand-title-bottom {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .badge-slot-reserved {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: #888888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Hero Content Section */
        .hero-flex-box {
            text-align: center;
            padding: 4px 0;
            margin-bottom: 16px;
        }

        .game-title-header {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 6px;
        }

        .flex-status-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .brand-green { color: #22c55e; }
        .brand-white { color: #ffffff; }

        .hero-time-display {
            font-family: 'Anton', sans-serif;
            font-size: 3.4rem;
            line-height: 0.9;
            color: #ffffff;
            letter-spacing: 2px;
            margin: 8px 0;
        }

        .hero-time-unit {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #888888;
            letter-spacing: 1px;
            margin-left: 2px;
            text-transform: lowercase;
        }
