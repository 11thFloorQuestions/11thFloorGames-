<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11th Floor Games - Promo</title>
    
    <!-- Favicon Configuration -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .promo-container {
            max-width: 600px;
            width: 100%;
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .logo-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .tagline {
            font-size: 1.2rem;
            color: #e63946;
            font-weight: 600;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .description {
            font-size: 1rem;
            line-height: 1.6;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        .cta-button {
            display: inline-block;
            background-color: #e63946;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }

        .cta-button:hover {
            background-color: #d62839;
        }
    </style>
</head>
<body>

    <div class="promo-container">
        <h1 class="logo-title">11th Floor Games</h1>
        <p class="tagline">Can you reach the 11th Floor?</p>
        <p class="description">
            A classy, modern hub of free daily quizzes, word puzzles, and logic games. 
            Ten sequential floors stand between you and victory. 
            New daily drops land every morning at 11:00 AM UK time.
        </p>
        <a href="index.html" class="cta-button">Enter Lobby</a>
    </div>

</body>
</html>
