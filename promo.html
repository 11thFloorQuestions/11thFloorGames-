<!-- PROMOTIONAL / SANDBOX VICTORY RECEIPT CARD -->
<div class="victory-receipt-card" id="victory-card-sandbox">
  
  <!-- Header / Badge Bar -->
  <div class="receipt-header">
    <div class="brand-title">THINK YOU KNOW BALL?</div>
    <div class="club-badge-slot" id="user-club-badge">
      <!-- Optional Club Crest SVG/PNG -->
      <span class="badge-placeholder">🛡️ [CLUB]</span>
    </div>
  </div>

  <div class="receipt-divider"></div>

  <!-- Hero Flex Banner -->
  <div class="hero-flex-box">
    <span class="flex-status">DESTINATION REACHED</span>
    <h1 class="hero-time">00:29</h1>
    <span class="flex-title">TOP BALL KNOWER</span>
  </div>

  <!-- Core Game Metrics -->
  <div class="receipt-details">
    <div class="receipt-row">
      <span class="row-label">ACCURACY</span>
      <span class="row-val success">100% (10/10)</span>
    </div>
    <div class="receipt-row">
      <span class="row-label">ACTIVE STREAK</span>
      <span class="row-val active">1 Day</span>
    </div>
  </div>

  <!-- Footer Link Branding -->
  <div class="receipt-footer">
    <span>11THFLOOR.GAMES/BALL</span>
  </div>

</div>

<!-- Primary Action Controls -->
<div class="share-actions-group">
  <button id="btn-copy-text" class="btn-share-primary">📋 COPY TEXT FLEX</button>
  <button id="btn-share-image" class="btn-share-secondary">📸 SHARE CARD</button>
</div>
