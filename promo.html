<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>11th Floor Parity — Victory Card Sandbox</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="apple-touch-icon" href="favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #000000 !important;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .sandbox-container {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            display: block;
            visibility: visible !important;
            opacity: 1 !important;
        }

        /* VICTORY RECEIPT CARD — PINK/PARITY GENRE THEME */
        .victory-receipt-card {
            width: 100%;
            background-color: #111111;
            border: 1px solid #ff9999;
            border-radius: 14px;
            padding: 22px 20px;
            box-shadow: 0 0 25px rgba(255, 153, 153, 0.35);
            margin-bottom: 16px;
            display: block;
        }

        /* Top Header Logo Bar */
        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333333;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        /* Brand Lockup */
        .brand-lockup-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-mark-left {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: #ff9999;
            line-height: 0.85;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(255, 153, 153, 0.35);
        }

        .brand-text-stacked {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
        }

        .brand-title-top {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .brand-title-bottom {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            color: #ff9999;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .badge-slot-reserved {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: #888888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Hero Content Section */
        .hero-flex-box {
            text-align: center;
            padding: 4px 0;
            margin-bottom: 16px;
        }

        .game-title-header {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 6px;
        }

        .flex-status-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .brand-pink { color: #ff9999; }
        .brand-green { color: #22c55e; }
        .brand-white { color: #ffffff; }

        .hero-time-display {
            font-family: 'Anton', sans-serif;
            font-size: 3.4rem;
            line-height: 0.9;
            color: #ffffff;
            letter-spacing: 2px;
            margin: 8px 0;
        }

        .hero-time-unit {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #888888;
            letter-spacing: 1px;
            margin-left: 2px;
            text-transform: lowercase;
        }

        .flex-tier-badge {
            display: inline-block;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            color: #ff9999;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(255, 153, 153, 0.1);
            border: 1px solid #ff9999;
            padding: 6px 16px;
            border-radius: 12px;
            margin-top: 6px;
        }

        /* Metric Rows */
        .receipt-details {
            border-top: 1px solid #333333;
            padding-top: 14px;
            margin-bottom: 16px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .receipt-row:last-child {
            margin-bottom: 0;
        }

        .row-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .row-val {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .row-val.success { color: #22c55e; }
        .row-val.active { color: #ff9999; }

        .card-footer-cta {
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 800;
            color: #888888;
            letter-spacing: 1.5px;
            border-top: 1px dashed #333333;
            padding-top: 10px;
            text-transform: uppercase;
        }

        /* BUTTON CONTROLS */
        .controls-group {
            width: 100%;
            display: block;
        }

        .btn-flex-action {
            width: 100%;
            background-color: #ff9999;
            border: 1px solid #ff9999;
            color: #000000;
            padding: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 153, 153, 0.35);
            margin-bottom: 10px;
            display: block;
        }

        .btn-secondary-action {
            width: 100%;
            background-color: #111111;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 24px;
            cursor: pointer;
            display: block;
        }

        #toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff9999;
            color: #000000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 8px 16px;
            border-radius: 20px;
            display: none;
            z-index: 1000;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="sandbox-container">
        <!-- VICTORY RECEIPT CARD -->
        <div class="victory-receipt-card" id="victory-card">
            <div class="receipt-header">
                <div class="brand-lockup-container">
                    <div class="brand-mark-left">11FL?</div>
                    <div class="brand-text-stacked">
                        <span class="brand-title-top">ELEVENTH FLOOR</span>
                        <span class="brand-title-bottom">PARITY</span>
                    </div>
                </div>
                <div class="badge-slot-reserved">VERIFIED</div>
            </div>

            <div class="hero-flex-box">
                <div class="game-title-header">
                    <span class="brand-pink">11th</span> <span class="brand-white">Floor Parity</span>
                </div>
                <div class="flex-status-label">
                    <span class="brand-pink">11th</span> <span class="brand-white">Floor Cleared</span>
                </div>
                <div class="hero-time-display">01:04<span class="hero-time-unit">s</span></div>
                <div class="flex-tier-badge">PERFECT</div>
            </div>

            <div class="receipt-details">
                <div class="receipt-row">
                    <span class="row-label">ELEVENTH FLOOR PARITY</span>
                    <span class="row-val">#042</span>
                </div>
                <div class="receipt-row">
                    <span class="row-label">ACCURACY</span>
                    <span class="row-val success">100% (10/10)</span>
                </div>
                <div class="receipt-row">
                    <span class="row-label">CURRENT STREAK</span>
                    <span class="row-val active">12 DAYS</span>
                </div>
            </div>

            <div class="card-footer-cta">
                NEW GAME DAILY!
            </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="controls-group">
            <button class="btn-flex-action" id="share-btn">SHARE</button>
            <button class="btn-secondary-action" id="copy-btn">COPY SUMMARY</button>
        </div>
    </div>

    <div id="toast-msg">COPIED TO CLIPBOARD</div>

    <script>
        const shareBtn = document.getElementById('share-btn');
        const copyBtn = document.getElementById('copy-btn');
        const toast = document.getElementById('toast-msg');

        function showToast(text) {
            toast.innerText = text;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }
