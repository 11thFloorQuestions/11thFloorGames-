<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor — Victory Card Sandbox</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="apple-touch-icon" href="favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #000000;
            --surface-card: #111111;
            --surface-border-light: #333333;
            --text-primary: #ffffff;
            --text-muted: #888888;
            --genre-pitch: #22c55e;
            --genre-pitch-glow: rgba(34, 197, 94, 0.35);
            --state-active: #facc15;
            --state-success: #22c55e;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-deep) !important;
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 14px;
            overflow-y: auto !important;
        }

        .sandbox-container {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* VICTORY RECEIPT CARD */
        .victory-receipt-card {
            width: 100%;
            background: var(--surface-card);
            border: 1px solid var(--genre-pitch);
            border-radius: 14px;
            padding: 22px 20px;
            box-shadow: 0 0 25px var(--genre-pitch-glow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        /* Top Header Logo Lockup Bar */
        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--surface-border-light);
            padding-bottom: 12px;
        }

        /* TWO-COLUMN BRAND LOCKUP */
        .brand-lockup-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-mark-left {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: var(--genre-pitch);
            line-height: 0.85;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px var(--genre-pitch-glow);
        }

            display: flex;
            flex-direction: column;
