<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor — Victory Card Sandbox</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-card: #111111;
            --surface-border: #222222;
            --surface-border-light: #333333;
            --text-primary: #ffffff;
            --text-muted: #888888;
            --genre-pitch: #22c55e;
            --genre-pitch-glow: rgba(34, 197, 94, 0.35);
            --state-active: #facc15;
            --state-success: #22c55e;
            --state-error: #ef4444;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 14px;
            overflow-y: auto;
        }

        .sandbox-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* THE VICTORY RECEIPT CARD */
        .victory-receipt-card {
            width: 100%;
            background: var(--surface-card);
            border: 1px solid var(--genre-pitch);
            border-radius: 14px;
            padding: 22px 20px;
            box-shadow: 0 0 25px var(--genre-pitch-glow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        /* Top Header */
        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--surface-border-light);
            padding-bottom: 12px;
        }

        .receipt-brand-logo {
            font-family: 'Anton', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 1px;
            line-height: 1;
            text-transform: uppercase;
        }

        .brand-green { color: var(--genre-pitch); }
        .brand-white { color: #ffffff; }

        .badge-slot-reserved {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Status & Hero Time */
        .hero-flex-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 4px 0;
        }

        .flex-status-label {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 2.5px;
            color: var(--genre-pitch);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .hero-time-display {
            font-family: 'Anton', sans-serif;
            font-size: 4rem;
            line-height: 0.9;
            color: #ffffff;
            letter-spacing: 2px;
            margin: 6px 0;
        }

        .flex-tier-badge {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--genre-pitch);
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--genre-pitch);
            padding: 6px 14px;
            border-radius: 12px;
            margin-top: 8px;
        }

        /* Metric Rows */
        .receipt-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid var(--surface-border-light);
            padding-top: 14px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .row-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .row-val {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .row-val.success { color: var(--state-success); }
        .row-val.active { color: var(--state-active); }

        /* BUTTON CONTROLS */
        .controls-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-flex-action {
            width: 100%;
            background-color: var(--genre-pitch);
            border: 1px solid var(--genre-pitch);
            color: #000000;
            padding: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--genre-pitch-glow);
            transition: transform 0.1s ease;
        }

        .btn-secondary-action {
            width: 100%;
            background-color: var(--surface-card);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 24px;
            cursor: pointer;
        }

        #toast-msg {
            position: fixed;
            bottom: 20px;
            background: var(--genre-pitch);
            color: #000000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 8px 16px;
            border-radius: 20px;
            display: none;
            box-shadow: 0 0 15px var(--genre-pitch-glow);
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="sandbox-container">

        <!-- THE RECEIPT CARD CONTAINER -->
        <div class="victory-receipt-card" id="victory-card">
            
            <div class="receipt-header">
                <span class="receipt-brand-logo">
                    <span class="brand-green">11th</span> <span class="brand-white">Floor Games</span>
                </span>
                <span class="badge-slot-reserved">[BADGE AREA]</span>
            </div>

            <div class="hero-flex-box">
                <span class="flex-status-label">11th Floor Reached</span>
                <div class="hero-time-display" id="display-time">00:44</div>
                <div class="flex-tier-badge" id="flex-tier-msg">EXPERT</div>
            </div>

            <div class="receipt-details">
                <div class="receipt-row">
                    <span class="row-label">Accuracy</span>
                    <span class="row-val success">100% (10/10)</span>
                </div>
                <div class="receipt-row">
                    <span class="row-label">Active Streak</span>
                    <span class="row-val active">1 Day</span>
                </div>
            </div>

        </div>

        <!-- SHARING CONTROLS -->
        <div class="controls-group">
            <button class="btn-flex-action" id="btn-copy-flex">SHARE</button>
            <button class="btn-secondary-action" id="btn-stats-vault">VIEW STATS & ARCHIVES</button>
        </div>

    </div>

    <div id="toast-msg">COPIED TO CLIPBOARD</div>

    <script>
        // Dynamic Tier Calculation based on seconds
        function getTierRank(totalSeconds) {
            if (totalSeconds < 50) return "EXPERT";
            if (totalSeconds <= 65) return "PUNDIT LEVEL";
            return "I KNOW BALL";
        }

        // Example time set for testing
        const sampleSeconds = 44; // Change this number to test (e.g. 44, 58, 72)
        const formattedTime = "00:44";
        const calculatedRank = getTierRank(sampleSeconds);

        document.getElementById('display-time').textContent = formattedTime;
        document.getElementById('flex-tier-msg').textContent = calculatedRank;

        document.getElementById('btn-copy-flex').addEventListener('click', () => {
            const flexText = 
`11th Floor: Think You Know Ball?
11th Floor Reached
Time: ${formattedTime} | ${calculatedRank}
Streak: 1 Day`;

            navigator.clipboard.writeText(flexText).then(() => {
                const toast = document.getElementById('toast-msg');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2000);
            });
        });
    </script>

</body>
</html>
