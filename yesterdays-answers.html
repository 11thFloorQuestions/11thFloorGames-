<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eleventh Floor Games — Yesterday's Answers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-card: #111111;
            --surface-border: #1e1e1e;
            --surface-border-light: #2a2a2a;
            --accent-red: #ff1f2d;
            --text-primary: #ffffff;
            --text-muted: #888888;

            /* Game Accent Palette */
            --color-terrace: #84CC16;
            --color-terrace-glow: rgba(132, 204, 22, 0.25);
            --color-cluegram: #cc007e;
            --color-cluegram-glow: rgba(204, 0, 126, 0.25);
            --color-questions: #D4AF37;
            --color-questions-glow: rgba(212, 175, 55, 0.25);
            --color-wordclimb: #3B82F6;
            --color-wordclimb-glow: rgba(59, 130, 246, 0.25);
            --color-clusters: #ff751f;
            --color-clusters-glow: rgba(255, 117, 31, 0.25);
            --color-parity: #ff9999;
            --color-parity-glow: rgba(255, 153, 153, 0.25);

            --current-accent: var(--color-terrace);
            --current-glow: var(--color-terrace-glow);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px 32px 12px;
        }

        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 8px;
        }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--current-accent);
            color: var(--current-accent);
        }

        .archive-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Sleek Header Branding */
        .hub-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 2px;
        }

        .hub-logo-red {
            font-family: 'Anton', sans-serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--accent-red);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 31, 45, 0.3);
            margin-bottom: 4px;
            animation: logoColorCycle 8s ease-in-out infinite;
        }

        .hub-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .hub-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @keyframes logoColorCycle {
            0%   { color: var(--accent-red); text-shadow: 0 0 20px rgba(255, 31, 45, 0.3); }
            14%  { color: var(--color-terrace); text-shadow: 0 0 20px var(--color-terrace-glow); }
            28%  { color: var(--color-cluegram); text-shadow: 0 0 20px var(--color-cluegram-glow); }
            42%  { color: var(--color-questions); text-shadow: 0 0 20px var(--color-questions-glow); }
            56%  { color: var(--color-wordclimb); text-shadow: 0 0 20px var(--color-wordclimb-glow); }
            70%  { color: var(--color-clusters); text-shadow: 0 0 20px var(--color-clusters-glow); }
            84%  { color: var(--color-parity); text-shadow: 0 0 20px var(--color-parity-glow); }
            100% { color: var(--accent-red); text-shadow: 0 0 20px rgba(255, 31, 45, 0.3); }
        }

        /* Game Switcher Tabs */
        .game-tabs-scroll {
            width: 100%;
            overflow-x: auto;
            display: flex;
            gap: 6px;
            padding: 2px 0;
            scrollbar-width: none;
        }

        .game-tabs-scroll::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.62rem;
            font-weight: 600;
            padding: 7px 11px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .tab-btn.active {
            color: #ffffff;
            border-color: var(--current-accent);
            box-shadow: 0 0 10px var(--current-glow);
            background: #141414;
        }

        /* Set Metadata Box */
        .set-meta-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .set-title-text {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--current-accent);
            text-transform: uppercase;
        }

        .set-date-badge {
            font-size: 0.55rem;
            font-weight: 600;
            background: #181818;
            border: 1px solid #282828;
            padding: 3px 6px;
            border-radius: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Dynamic Floor Stack */
        .answers-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .floor-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            overflow: hidden;
        }

        .floor-card-header {
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121212;
            border-bottom: 1px solid #1a1a1a;
        }

        .floor-number-badge {
            font-family: 'Anton', sans-serif;
            font-size: 1rem;
            color: var(--current-accent);
            letter-spacing: 0.5px;
        }

        .floor-type-tag {
            font-size: 0.52rem;
            font-weight: 700;
            color: var(--text-muted);
            background: #000000;
            border: 1px solid #222222;
            padding: 2px 5px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .floor-card-body {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .q-text {
            font-size: 0.74rem;
            font-weight: 500;
            line-height: 1.35;
            color: #eeeeee;
        }

        .options-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .opt-chip {
            font-size: 0.62rem;
            font-weight: 600;
            padding: 6px;
            border-radius: 4px;
            background: #080808;
            border: 1px solid #1a1a1a;
            color: var(--text-muted);
            text-align: center;
        }

        .opt-chip.correct-chip {
            background: rgba(34, 197, 94, 0.1);
            border-color: #22c55e;
            color: #86EFAC;
        }

        .opt-chip.trap-chip {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            color: #FCA5A5;
        }

        /* Blossom-Style Word Climb Layout */
        .wheel-letters-row {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
            margin: 2px 0;
        }

        .letter-bubble {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #141414;
            border: 1px solid var(--surface-border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            color: #ffffff;
        }

        .blossom-stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin: 4px 0;
            background: #080808;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            padding: 8px;
            text-align: center;
        }

        .blossom-stat-val {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-wordclimb);
        }

        .blossom-stat-lbl {
            font-size: 0.48rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .word-accordion-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
        }

        .cluster-group-box {
            background: #080808;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            padding: 7px 9px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .cluster-cat-title {
            font-size: 0.58rem;
            font-weight: 700;
            color: var(--current-accent);
            text-transform: uppercase;
        }

        .cluster-words-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* Context / Fact Callout */
        .fact-box {
            background: #080808;
            border-left: 2px solid var(--current-accent);
            padding: 8px 10px;
            border-radius: 0 4px 4px 0;
        }

        .fact-title {
            font-size: 0.52rem;
            font-weight: 700;
            color: var(--current-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .fact-text {
            font-size: 0.65rem;
            font-weight: 400;
            color: #bbbbbb;
            line-height: 1.3;
        }

        .anchor-tag {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.52rem;
            font-weight: 600;
            color: var(--text-muted);
            background: #121212;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* Commercial Upgrade Banner */
        .promo-affiliate-card {
            background: linear-gradient(135deg, #121212 0%, #080808 100%);
            border: 1px solid var(--current-accent);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: center;
            box-shadow: 0 0 12px var(--current-glow);
            margin-top: 6px;
        }

        .affiliate-badge {
            font-size: 0.48rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--current-accent);
            text-transform: uppercase;
        }

        .affiliate-title {
            font-family: 'Anton', sans-serif;
            font-size: 1rem;
            color: #ffffff;
            text-transform: uppercase;
        }

        .affiliate-desc {
            font-size: 0.62rem;
            color: var(--text-muted);
            line-height: 1.3;
            font-weight: 400;
        }

        .affiliate-btn {
            background: var(--current-accent);
            color: #000000;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
    </style>

    <!-- Project External Dataset Dependencies -->
    <script src="./cluegram-data.js"></script>
    <script src="./clusters-data.js"></script>
    <script src="./parity-data.js"></script>
    <script src="./words.js"></script>
</head>
<body>

    <div class="archive-container">
        <div class="top-bar">
            <a href="index.html" class="pill-btn">← LOBBY</a>
        </div>

        <div class="hub-logo-box">
            <h1 class="hub-logo-red">11FL?</h1>
            <p class="hub-logo-title">Eleventh Floor</p>
            <p class="hub-logo-sub">YESTERDAY'S ANSWERS</p>
        </div>

        <!-- Game Switcher Tabs -->
        <div class="game-tabs-scroll">
            <button class="tab-btn active" data-game="ball" data-color="#84CC16" data-glow="rgba(132, 204, 22, 0.25)">Think You Know Ball?</button>
            <button class="tab-btn" data-game="cluegram" data-color="#cc007e" data-glow="rgba(204, 0, 126, 0.25)">Cluegram</button>
            <button class="tab-btn" data-game="questions" data-color="#D4AF37" data-glow="rgba(212, 175, 55, 0.25)">Questions</button>
            <button class="tab-btn" data-game="wordclimb" data-color="#3B82F6" data-glow="rgba(59, 130, 246, 0.25)">Word Climb</button>
            <button class="tab-btn" data-game="clusters" data-color="#ff751f" data-glow="rgba(255, 117, 31, 0.25)">Clusters</button>
            <button class="tab-btn" data-game="parity" data-color="#ff9999" data-glow="rgba(255, 153, 153, 0.25)">Parity</button>
        </div>

        <!-- Set Metadata Box -->
        <div class="set-meta-card">
            <div class="set-title-text" id="meta-set-title">Think You Know Ball? — Set 30</div>
            <div class="set-date-badge">YESTERDAY'S RECAP</div>
        </div>

        <!-- Answers Display Zone -->
        <div class="answers-list" id="answers-list">
            <!-- Dynamic Content Rendered Here -->
        </div>

        <div class="promo-affiliate-card">
            <div class="affiliate-badge">OFFICIAL MATCHDAY PARTNER</div>
            <div class="affiliate-title">WANT UNLIMITED ARCHIVE ACCESS?</div>
            <div class="affiliate-desc">Play every past 10-floor climb, unlock custom daily quizzes, and remove single-attempt streak limits.</div>
            <button class="affiliate-btn">UNLOCK FULL ARCHIVE — £20/YEAR</button>
        </div>
    </div>

    <script>
        const ordinals = ["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th", "10th"];

        /* Dynamic JSON Helper */
        async function fetchJSON(filename) {
            const paths = [`./${filename}`, `./data/${filename}`, `./archives/${filename}`, filename];
            for (const path of paths) {
                try {
                    const res = await fetch(path);
                    if (res.ok) return await res.json();
                } catch (e) {}
            }
            return null;
        }

        /* RENDER ENGINE FOR ALL 6 GAMES */
        async function renderGameAnswers(gameKey) {
            const container = document.getElementById('answers-list');
            const metaTitle = document.getElementById('meta-set-title');
            container.innerHTML = '';

            if (gameKey === 'ball') {
                const data = await fetchJSON('ball-questions.json');
                if (data && (data.questions || data.floors)) {
                    metaTitle.innerText = data.title || "Think You Know Ball?";
                    const list = data.questions || data.floors;
                    list.forEach(q => {
                        const floorOrd = ordinals[(q.floor || 1) - 1] || `${q.floor}th`;
                        let optionsHTML = '';
                        if (q.options) {
                            q.options.forEach(opt => {
                                const isCorrect = (opt === q.answer);
                                optionsHTML += `<div class="opt-chip ${isCorrect ? 'correct-chip' : ''}">${opt}</div>`;
                            });
                        }
                        container.innerHTML += `
                            <div class="floor-card">
                                <div class="floor-card-header">
                                    <div class="floor-number-badge">${floorOrd} Floor</div>
                                    <div class="floor-type-tag">${q.type === 'boolean' ? 'TRUE / FALSE' : 'MULTIPLE CHOICE'}</div>
                                </div>
                                <div class="floor-card-body">
                                    <div class="q-text">${q.question}</div>
                                    <div class="options-list">${optionsHTML}</div>
                                    <div class="fact-box">
                                        <div class="fact-title">Terrace Context & Fact</div>
                                        <div class="fact-text">${q.explanation || ''}</div>
                                        ${q.anchorClues ? `<div class="anchor-tag">📌 ${q.anchorClues}</div>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
            } 
            else if (gameKey === 'questions') {
                const data = await fetchJSON('questions.json');
                if (data && (data.floors || data.questions)) {
                    metaTitle.innerText = data.title || "11th Floor Questions";
                    const list = data.floors || data.questions;
                    list.forEach(q => {
                        const floorOrd = ordinals[(q.floor || 1) - 1] || `${q.floor}th`;
                        let optionsHTML = '';
                        if (q.options) {
                            q.options.forEach(opt => {
                                const isCorrect = (opt === q.answer);
                                optionsHTML += `<div class="opt-chip ${isCorrect ? 'correct-chip' : ''}">${opt}</div>`;
                            });
                        }
                        container.innerHTML += `
                            <div class="floor-card">
                                <div class="floor-card-header">
                                    <div class="floor-number-badge">${floorOrd} Floor</div>
                                    <div class="floor-type-tag">MULTIPLE CHOICE</div>
                                </div>
                                <div class="floor-card-body">
                                    <div class="q-text">${q.question}</div>
                                    <div class="options-list">${optionsHTML}</div>
                                    <div class="fact-box">
                                        <div class="fact-title">Fact Context & Breakdown</div>
                                        <div class="fact-text">Correct Answer: <strong>${q.answer}</strong>. Distractor choices included standard high-brow alternatives to test precise recall.</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
            } 
            else if (gameKey === 'cluegram') {
                const list = window.CLUEGRAM_DAILY_SET || [];
                metaTitle.innerText = "11th Floor Cluegram — Daily Solutions";
                list.forEach(item => {
                    const floorOrd = ordinals[item.floor - 1] || `${item.floor}th`;
                    container.innerHTML += `
                        <div class="floor-card">
                            <div class="floor-card-header">
                                <div class="floor-number-badge">${floorOrd} Floor</div>
                                <div class="floor-type-tag">${item.length || item.target.length} LETTERS</div>
                            </div>
                            <div class="floor-card-body">
                                <div class="q-text">Scrambled: <strong style="color: #cc007e; font-family: monospace;">${item.scrambled}</strong></div>
                                <div class="opt-chip correct-chip" style="font-size: 0.7rem; letter-spacing: 1px;">TARGET: ${item.target}</div>
                                <div class="fact-box">
                                    <div class="fact-title">Clue Definition</div>
                                    <div class="fact-text">${item.clue}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } 
            else if (gameKey === 'clusters') {
                const dataset = window.CLUSTERS_DATA || {};
                const dates = Object.keys(dataset);
                const latestKey = dates[dates.length - 1];
                const puzzleObj = dataset[latestKey] || {};
                metaTitle.innerText = puzzleObj.title || "11th Floor Clusters";

                if (puzzleObj.floors) {
                    Object.keys(puzzleObj.floors).forEach(floorNum => {
                        const fData = puzzleObj.floors[floorNum];
                        const floorOrd = ordinals[parseInt(floorNum, 10) - 1] || `${floorNum}th`;
                        
                        let groupsHTML = '';
                        let matchedWords = [];
                        fData.groups.forEach(g => {
                            matchedWords.push(...g.words);
                            const wordsList = g.words.map(w => `<span class="opt-chip correct-chip" style="padding: 3px 5px; font-size: 0.58rem;">${w}</span>`).join(' ');
                            groupsHTML += `
                                <div class="cluster-group-box">
                                    <div class="cluster-cat-title">✓ ${g.clue || g.category} (${g.category})</div>
                                    <div class="cluster-words-row">${wordsList}</div>
                                </div>
                            `;
                        });

                        const distractors = fData.tiles.filter(t => !matchedWords.includes(t));
                        const distractorsHTML = distractors.map(d => `<span class="opt-chip trap-chip" style="padding: 3px 5px; font-size: 0.58rem;">${d}</span>`).join(' ');

                        container.innerHTML += `
                            <div class="floor-card">
                                <div class="floor-card-header">
                                    <div class="floor-number-badge">${floorOrd} Floor</div>
                                    <div class="floor-type-tag">CLUSTER WALL</div>
                                </div>
                                <div class="floor-card-body">
                                    ${groupsHTML}
                                    ${distractors.length ? `
                                        <div class="cluster-group-box" style="border-color: rgba(239,68,68,0.2);">
                                            <div class="cluster-cat-title" style="color: #ef4444;">✖ TRAP DISTRACTORS</div>
                                            <div class="cluster-words-row">${distractorsHTML}</div>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    });
                }
            } 
            else if (gameKey === 'wordclimb') {
                metaTitle.innerText = "11th Floor Word Climb — Master Board 'MAGNITUDE'";
                const masterWord = "MAGNITUDE";
                const wheelArr = ["M", "A", "G", "N", "I", "T", "U", "D", "E"];
                const wheelBubbles = wheelArr.map(l => `<div class="letter-bubble">${l}</div>`).join('');

                container.innerHTML += `
                    <div class="cluster-group-box" style="border-color: var(--color-wordclimb); margin-bottom: 2px;">
                        <div class="cluster-cat-title" style="color: var(--color-wordclimb); text-align: center;">DAILY MASTER WHEEL</div>
                        <div class="wheel-letters-row">${wheelBubbles}</div>
                        <div style="font-size: 0.58rem; color: var(--text-muted); text-align: center; margin-top: 2px;">Master 9-Letter Target: <strong style="color: #ffffff;">${masterWord}</strong></div>
                    </div>

                    <div class="blossom-stats-grid">
                        <div><div class="blossom-stat-val">9</div><div class="blossom-stat-lbl">5-Letter</div></div>
                        <div><div class="blossom-stat-val">6</div><div class="blossom-stat-lbl">6-Letter</div></div>
                        <div><div class="blossom-stat-val">2</div><div class="blossom-stat-lbl">7-Letter</div></div>
                        <div><div class="blossom-stat-val">1</div><div class="blossom-stat-lbl">8-Letter</div></div>
                        <div><div class="blossom-stat-val">1</div><div class="blossom-stat-lbl">9-Letter</div></div>
                    </div>
                `;

                const wordsByLen = {
                    5: ["GIANT", "AGENT", "GUIDE", "IMAGE", "MEDIA", "AMEND", "UNITE", "MINED", "GAUNT"],
                    6: ["UNITED", "DATING", "MAGNET", "GAINED", "TANDEM", "UNTIED"],
                    7: ["UNTAMED", "GAUNTED"],
                    8: ["UNTAMING"],
                    9: ["MAGNITUDE"]
                };

                let accordionSections = '';
                [5, 6, 7, 8, 9].forEach(len => {
                    const words = wordsByLen[len] || [];
                    const wordChips = words.map(w => `<span class="opt-chip ${w === masterWord ? 'correct-chip' : ''}" style="padding: 3px 6px; font-size: 0.58rem;">${w}</span>`).join(' ');
                    accordionSections += `
                        <div class="cluster-group-box">
                            <div class="cluster-cat-title">✓ ${len}-LETTER VALID WORDS (${words.length})</div>
                            <div class="cluster-words-row">${wordChips}</div>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="word-accordion-container">
                        ${accordionSections}
                    </div>
                `;
            } 
            else if (gameKey === 'parity') {
                metaTitle.innerText = "11th Floor Parity";
                container.innerHTML = `
                    <div class="floor-card">
                        <div class="floor-card-header">
                            <div class="floor-number-badge">Parity</div>
                            <div class="floor-type-tag">ANNOUNCEMENT</div>
                        </div>
                        <div class="floor-card-body">
                            <div class="q-text" style="font-weight: 700; color: #ffffff; font-size: 0.85rem;">Nothing to see here! Never will be.</div>
                            <div class="fact-box" style="border-left-color: var(--color-parity);">
                                <div class="fact-title" style="color: var(--color-parity);">Shameless Plug Ahead</div>
                                <div class="fact-text" style="line-height: 1.4;">
                                    Parity is a dynamic visual pair-matching climb, so yesterday's solutions don't really apply. But since you entered, we are shamelessly using this space to plug our upcoming game...<br><br>
                                    <strong style="color: #ffffff;">COMING SOON: TYKB "The Skyscraper"</strong> — A 51-floor Mega Quiz for true football fanatics!
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        /* TAB SWITCHER & ACCENT TINTING */
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const gameKey = btn.getAttribute('data-game');
                const accentColor = btn.getAttribute('data-color');
                const glowColor = btn.getAttribute('data-glow');

                document.documentElement.style.setProperty('--current-accent', accentColor);
                document.documentElement.style.setProperty('--current-glow', glowColor);

                renderGameAnswers(gameKey);
            });
        });

        // Initial Load
        window.onload = () => {
            renderGameAnswers('ball');
        };
    </script>
</body>
</html>
