<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eleventh Floor Games — Yesterday's Answers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-card: #111111;
            --surface-border: #1e1e1e;
            --surface-border-light: #2a2a2a;
            --accent-red: #ff1f2d;
            --text-primary: #ffffff;
            --text-muted: #888888;

            /* Game Accent Palette */
            --color-terrace: #84CC16;
            --color-terrace-glow: rgba(132, 204, 22, 0.25);
            --color-cluegram: #cc007e;
            --color-cluegram-glow: rgba(204, 0, 126, 0.25);
            --color-questions: #D4AF37;
            --color-questions-glow: rgba(212, 175, 55, 0.25);
            --color-wordclimb: #3B82F6;
            --color-wordclimb-glow: rgba(59, 130, 246, 0.25);
            --color-clusters: #ff751f;
            --color-clusters-glow: rgba(255, 117, 31, 0.25);
            --color-parity: #ff9999;
            --color-parity-glow: rgba(255, 153, 153, 0.25);

            --current-accent: var(--color-terrace);
            --current-glow: var(--color-terrace-glow);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px 32px 12px;
        }

        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 8px;
        }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--current-accent);
            color: var(--current-accent);
        }

        .archive-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Sleek Header Branding */
        .hub-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 2px;
        }

        .hub-logo-red {
            font-family: 'Anton', sans-serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--accent-red);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 31, 45, 0.3);
            margin-bottom: 4px;
            animation: logoColorCycle 8s ease-in-out infinite;
        }

        .hub-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .hub-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @keyframes logoColorCycle {
            0%   { color: var(--accent-red); text-shadow: 0 0 20px rgba(255, 31, 45, 0.3); }
            14%  { color: var(--color-terrace); text-shadow: 0 0 20px var(--color-terrace-glow); }
            28%  { color: var(--color-cluegram); text-shadow: 0 0 20px var(--color-cluegram-glow); }
            42%  { color: var(--color-questions); text-shadow: 0 0 20px var(--color-questions-glow); }
            56%  { color: var(--color-wordclimb); text-shadow: 0 0 20px var(--color-wordclimb-glow); }
            70%  { color: var(--color-clusters); text-shadow: 0 0 20px var(--color-clusters-glow); }
            84%  { color: var(--color-parity); text-shadow: 0 0 20px var(--color-parity-glow); }
            100% { color: var(--accent-red); text-shadow: 0 0 20px rgba(255, 31, 45, 0.3); }
        }

        /* Game Switcher Tabs */
        .game-tabs-scroll {
            width: 100%;
            overflow-x: auto;
            display: flex;
            gap: 6px;
            padding: 2px 0;
            scrollbar-width: none;
        }

        .game-tabs-scroll::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.62rem;
            font-weight: 600;
            padding: 7px 11px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .tab-btn.active {
            color: #ffffff;
            border-color: var(--current-accent);
            box-shadow: 0 0 10px var(--current-glow);
            background: #141414;
        }

        /* Set Metadata Box */
        .set-meta-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .set-title-text {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--current-accent);
            text-transform: uppercase;
        }

        .set-date-badge {
            font-size: 0.55rem;
            font-weight: 600;
            background: #181818;
            border: 1px solid #282828;
            padding: 3px 6px;
            border-radius: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Dynamic Floor Stack */
        .answers-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .floor-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            overflow: hidden;
        }

        .floor-card-header {
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121212;
            border-bottom: 1px solid #1a1a1a;
        }

        .floor-number-badge {
            font-family: 'Anton', sans-serif;
            font-size: 1rem;
            color: var(--current-accent);
            letter-spacing: 0.5px;
        }

        .floor-type-tag {
            font-size: 0.52rem;
            font-weight: 700;
            color: var(--text-muted);
            background: #000000;
            border: 1px solid #222222;
            padding: 2px 5px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .floor-card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .q-text {
            font-size: 0.82rem;
            font-weight: 600;
            line-height: 1.45;
            color: #ffffff;
        }

        .options-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .opt-chip {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 4px;
            background: #080808;
            border: 1px solid #1a1a1a;
            color: var(--text-muted);
            text-align: center;
        }

        .opt-chip.correct-chip {
            background: rgba(34, 197, 94, 0.12);
            border-color: #22c55e;
            color: #86EFAC;
            font-weight: 700;
        }

        .opt-chip.trap-chip {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            color: #FCA5A5;
        }

        /* Blossom-Style Word Climb Layout */
        .wheel-letters-row {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
            margin: 4px 0;
        }

        .letter-bubble {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #141414;
            border: 1px solid var(--surface-border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: #ffffff;
        }

        .blossom-stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin: 6px 0;
            background: #080808;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            padding: 8px;
            text-align: center;
        }

        .blossom-stat-val {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--color-wordclimb);
        }

        .blossom-stat-lbl {
            font-size: 0.48rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .word-accordion-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
        }

        .cluster-group-box {
            background: #080808;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cluster-cat-title {
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--current-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cluster-words-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* Context / Fact Callout */
        .fact-box {
            background: #080808;
            border-left: 3px solid var(--current-accent);
            padding: 10px 12px;
            border-radius: 0 4px 4px 0;
            margin-top: 2px;
        }

        .fact-title {
            font-size: 0.58rem;
            font-weight: 700;
            color: var(--current-accent);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .fact-text {
            font-size: 0.72rem;
            font-weight: 400;
            color: #cccccc;
            line-height: 1.45;
        }

        .fact-text strong {
            color: #ffffff;
        }

        .anchor-tag {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.58rem;
            font-weight: 600;
            color: var(--text-muted);
            background: #121212;
            padding: 3px 6px;
            border-radius: 3px;
            border: 1px solid #222222;
        }

        /* Commercial Upgrade Banner */
        .promo-affiliate-card {
