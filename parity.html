<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor Parity — Daily Puzzle</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- HTML2CANVAS LIBRARY FOR RECEIPT SCREENSHOT CAPTURE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #262626;
            --surface-border-light: #3a3a3a;
            --text-primary: #ffffff;
            --text-muted: #888888;
            --genre-pink: #ff9999;
            --genre-pink-glow: rgba(255, 153, 153, 0.35);
            --brand-red: #cc0000;
            --brand-red-glow: rgba(204, 0, 0, 0.35);
            --state-active: #facc15;
            --state-active-glow: rgba(250, 204, 21, 0.3);
            --state-warning: #f97316;
            --state-warning-glow: rgba(249, 115, 22, 0.35);
            --state-error: #ef4444;
            --state-error-glow: rgba(239, 68, 68, 0.3);
            --state-success: #22c55e;
            --state-success-glow: rgba(34, 197, 94, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            overflow: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            flex-grow: 1;
        }

        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--genre-pink);
            color: var(--genre-pink);
        }

        .header-timer {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--state-active);
            letter-spacing: 1px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 4px 12px;
            border-radius: 12px;
            display: none;
        }

        .game-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
            text-align: center;
            flex-shrink: 0;
        }

        .game-logo-pink {
            font-family: 'Anton', sans-serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--genre-pink);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px var(--genre-pink-glow);
            margin-bottom: 4px;
        }

        .game-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .game-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--genre-pink);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .gameplay-header-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 4px;
            text-align: center;
            flex-shrink: 0;
        }

        .gameplay-header-box .game-logo-title {
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            margin-bottom: 1px;
        }

        .gameplay-header-box .game-logo-sub {
            font-size: 0.55rem;
            letter-spacing: 3px;
        }

        #start-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            padding: 16px 14px;
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            border-radius: 8px;
            margin-top: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .landing-shaft-graphic {
            display: flex;
            flex-direction: column;
            width: 52px;
            height: 140px;
            border: 1px solid var(--surface-border-light);
            border-radius: 8px;
            padding: 6px;
            gap: 3px;
            background-color: #111111;
        }

        .landing-shaft-box {
            flex: 1;
            background-color: #080808;
            border: 1px solid var(--surface-border);
            border-radius: 2px;
        }

        .landing-shaft-graphic .landing-shaft-box { animation: sweepMiddle 1.2s ease-in-out forwards; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(11) { animation: sweepBottomSettle 2.6s ease-in-out forwards; animation-delay: 0.05s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(10) { animation-delay: 0.15s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(9)  { animation-delay: 0.25s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(8)  { animation-delay: 0.35s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(7)  { animation-delay: 0.45s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(6)  { animation-delay: 0.55s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(5)  { animation-delay: 0.65s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(4)  { animation-delay: 0.75s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(3)  { animation-delay: 0.85s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(2)  { animation-delay: 0.95s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(1)  { animation: sweepTopGreen 1.6s ease-in-out forwards; animation-delay: 1.05s; }

        @keyframes sweepMiddle {
            0% { background-color: #080808; border-color: var(--surface-border); box-shadow: none; }
            30% { background-color: var(--genre-pink); border-color: var(--genre-pink); box-shadow: 0 0 10px var(--genre-pink-glow); }
            60%, 100% { background-color: #080808; border-color: var(--surface-border); box-shadow: none; }
        }

        @keyframes sweepTopGreen {
            0% { background-color: #080808; border-color: var(--surface-border); box-shadow: none; }
            20%, 70% { background-color: var(--state-success); border-color: var(--state-success); box-shadow: 0 0 16px var(--state-success-glow); }
            100% { background-color: #080808; border-color: var(--surface-border); box-shadow: none; }
        }

        @keyframes sweepBottomSettle {
            0% { background-color: #080808; border-color: var(--surface-border); box-shadow: none; }
