<!-- Stats & Archive Vault Modal -->
    <div id="modal-vault" class="modal-overlay hidden">
        <div class="modal-card modal-large">
            <h2 style="font-size: 1.2rem; font-weight: 800; color: var(--genre-pink);">STATS</h2>
            <div class="stats-summary-grid">
                <div class="stat-box"><span id="stat-played" class="stat-val" style="color: var(--genre-pink);">0</span><span class="stat-lbl">Played</span></div>
                <div class="stat-box"><span id="stat-wins" class="stat-val" style="color: var(--genre-pink);">0</span><span class="stat-lbl">Wins</span></div>
                <div class="stat-box"><span id="stat-winrate" class="stat-val" style="color: var(--genre-pink);">0%</span><span class="stat-lbl">Win %</span></div>
                <div class="stat-box"><span id="stat-streak" class="stat-val" style="color: var(--genre-pink);">0</span><span class="stat-lbl">Streak</span></div>
                <div class="stat-box" style="grid-column: span 2;"><span id="stat-bestfloor" class="stat-val">FL 01</span><span class="stat-lbl">Best Peak</span></div>
            </div>

            <h3 style="font-size: 0.72rem; font-weight: 700; color: var(--genre-pink); margin-top: 10px; text-transform: uppercase;">ARCHIVE VAULT</h3>
            <div id="vault-list" class="vault-grid"></div>
            <button id="btn-close-vault" class="btn-modal">CLOSE</button>
        </div>
    </div>
