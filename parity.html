<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor Parity — Daily Puzzle</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #262626;
            --surface-border-light: #3a3a3a;
            --text-primary: #ffffff;
            --text-muted: #888888;
            --genre-pink: #ff9999;
            --genre-pink-glow: rgba(255, 153, 153, 0.35);
            --state-active: #facc15;
            --state-active-glow: rgba(250, 204, 21, 0.3);
            --state-warning: #f97316;
            --state-warning-glow: rgba(249, 115, 22, 0.35);
            --state-error: #ef4444;
            --state-error-glow: rgba(239, 68, 68, 0.3);
            --state-success: #22c55e;
            --state-success-glow: rgba(34, 197, 94, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            overflow: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            flex-grow: 1;
        }

        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--genre-pink);
            color: var(--genre-pink);
        }

        .header-timer {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--state-active);
            letter-spacing: 1px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 4px 12px;
            border-radius: 12px;
            display: none;
        }

        .game-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
            text-align: center;
            flex-shrink: 0;
        }

        .game-logo-pink {
            font-family: 'Anton', sans-serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--genre-pink);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px var(--genre-pink-glow);
            margin-bottom: 4px;
        }

        .game-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .game-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--genre-pink);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .gameplay-header-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 4px;
            text-align: center;
            flex-shrink: 0;
        }
