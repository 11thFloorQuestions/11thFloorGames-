    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #222222;
            --surface-border-light: #333333;
            --text-primary: #ffffff;
            --text-muted: #888888;
            --genre-pitch: #22c55e;
            --genre-pitch-glow: rgba(34, 197, 94, 0.35);
            --state-active: #facc15;
            --state-success: #22c55e;
            --state-error: #ef4444;
            --state-error-glow: rgba(239, 68, 68, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 12px 10px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100%;
        }

        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--genre-pitch);
            color: var(--genre-pitch);
        }

        .header-timer {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--state-active);
            letter-spacing: 1px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 4px 12px;
            border-radius: 12px;
            display: none;
        }

        .game-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
            text-align: center;
            flex-shrink: 0;
        }
