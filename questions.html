    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #222222;
            --surface-border-light: #333333;
            --text-primary: #ffffff;
            --text-muted: #888888;
            --genre-gold: #facc15;
            --genre-gold-glow: rgba(250, 204, 21, 0.35);
            --brand-red: #cc0000;
            --brand-red-glow: rgba(204, 0, 0, 0.35);
            --state-active: #facc15;
            --state-active-glow: rgba(250, 204, 21, 0.3);
            --state-success: #22c55e;
            --state-success-glow: rgba(34, 197, 94, 0.3);
            --state-error: #ef4444;
            --state-error-glow: rgba(239, 68, 68, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 10px;
        }

        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--genre-gold);
            color: var(--genre-gold);
        }

        .header-timer {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--state-active);
            letter-spacing: 1px;
            background: #111111;
            border: 1px solid var(--surface-border-light);
            padding: 4px 10px;
            border-radius: 8px;
            display: none;
        }

        .game-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
            text-align: center;
            flex-shrink: 0;
        }

        .game-logo-gold {
            font-family: 'Anton', sans-serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--genre-gold);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px var(--genre-gold-glow);
            margin-bottom: 4px;
        }

        .game-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .game-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--genre-gold);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .gameplay-header-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
            text-align: center;
            flex-shrink: 0;
        }

        #landing-screen {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }

        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            padding: 20px 16px;
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            margin-top: 6px;
        }

        .landing-shaft-graphic {
            display: flex;
            flex-direction: column;
            width: 52px;
            height: 150px;
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 6px;
            gap: 3px;
            background-color: var(--surface);
        }

        .landing-shaft-box {
            flex: 1;
            background-color: #111111;
            border: 1px solid var(--surface-border);
            border-radius: 2px;
        }

        .landing-shaft-graphic .landing-shaft-box { animation: sweepMiddle 1.2s ease-in-out forwards; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(11) { animation: sweepBottomSettle 2.6s ease-in-out forwards; animation-delay: 0.05s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(10) { animation-delay: 0.15s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(9)  { animation-delay: 0.25s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(8)  { animation-delay: 0.35s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(7)  { animation-delay: 0.45s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(6)  { animation-delay: 0.55s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(5)  { animation-delay: 0.65s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(4)  { animation-delay: 0.75s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(3)  { animation-delay: 0.85s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(2)  { animation-delay: 0.95s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(1)  { animation: sweepTopGreen 1.6s ease-in-out forwards; animation-delay: 1.05s; }

        @keyframes sweepMiddle {
            0% { background-color: #111111; border-color: var(--surface-border); box-shadow: none; }
            30% { background-color: var(--genre-gold); border-color: var(--genre-gold); box-shadow: 0 0 10px var(--genre-gold-glow); }
            60%, 100% { background-color: #111111; border-color: var(--surface-border); box-shadow: none; }
        }

        @keyframes sweepTopGreen {
            0% { background-color: #111111; border-color: var(--surface-border); box-shadow: none; }
            20%, 70% { background-color: var(--state-success); border-color: var(--state-success); box-shadow: 0 0 16px var(--state-success-glow); }
            100% { background-color: #111111; border-color: var(--surface-border); box-shadow: none; }
        }

        @keyframes sweepBottomSettle {
            0% { background-color: #111111; border-color: var(--surface-border); box-shadow: none; }
            15% { background-color: var(--genre-gold); border-color: var(--genre-gold); box-shadow: 0 0 10px var(--genre-gold-glow); }
            30%, 80% { background-color: #111111; border-color: var(--surface-border); box-shadow: none; }
            95%, 100% { background-color: var(--genre-gold); border-color: var(--genre-gold); box-shadow: 0 0 8px var(--genre-gold-glow); }
        }

        .landing-challenge-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .btn-start {
            background-color: var(--surface);
            border: 1px solid var(--genre-gold);
            color: var(--genre-gold);
            padding: 12px 28px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--genre-gold-glow);
            transition: all 0.2s ease;
        }

        .btn-start:hover {
            background-color: var(--genre-gold);
            color: #000000;
            box-shadow: 0 4px 25px var(--genre-gold-glow);
        }

        .hud-sidebar-container { width: 100%; max-width: 600px; display: flex; align-items: stretch; gap: 12px; margin-bottom: 6px; flex-shrink: 0; }
        .tower-stack { display: flex; flex-direction: column; gap: 2px; width: 52px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 8px; padding: 6px; justify-content: space-between; flex-shrink: 0; }
        .tower-floor { height: 7px; border: 1px solid var(--surface-border); background: #111111; transition: all 0.2s ease; border-radius: 2px; }
        .tower-floor.active, .tower-floor.active-floor { border-color: var(--genre-gold); background: var(--genre-gold); box-shadow: 0 0 8px var(--genre-gold-glow); }
        .tower-floor.completed { border-color: var(--state-success); background: var(--state-success); box-shadow: 0 0 6px var(--state-success-glow); }
        .tower-floor.failed { border-color: var(--state-error); background: var(--state-error); box-shadow: 0 0 6px var(--state-error-glow); }
        .floor-info-box { flex-grow: 1; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 8px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
        .floor-left-group { display: flex; flex-direction: column; gap: 4px; }
        .current-floor-display { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; }
