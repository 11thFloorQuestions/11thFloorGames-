<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11th Floor Games | Questions</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --genre-gold: #f59e0b;
            --genre-gold-glow: rgba(245, 158, 11, 0.4);
            --state-error: #ef4444;
            --state-error-glow: rgba(239, 68, 68, 0.5);
            --surface-card: #18181b;
            --surface-border: #27272a;
            --text-primary: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        body {
            background-color: #09090b;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-card {
            background-color: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .timer-track {
            width: 100%;
            height: 8px;
            background-color: var(--surface-border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: var(--genre-gold);
            box-shadow: 0 0 10px var(--genre-gold-glow);
            transition: width 0.1s linear, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .timer-bar.warning {
            background-color: var(--state-error) !important;
            box-shadow: 0 0 14px var(--state-error-glow) !important;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background-color: #27272a;
            border: 1px solid #3f3f46;
            color: var(--text-primary);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #3f3f46;
            border-color: var(--genre-gold);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            background-color: #15803d;
            border-color: #22c55e;
            color: #ffffff;
        }

        .option-btn.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
            color: #ffffff;
        }

        .controls {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .primary-btn {
            background-color: var(--genre-gold);
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .primary-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <main class="quiz-card">
        <div class="timer-track">
            <div id="timer-bar" class="timer-bar"></div>
        </div>
        <div id="question-container">
            <p id="question-text" class="question-text">Loading daily general knowledge challenge...</p>
            <div id="options-grid" class="options-grid"></div>
        </div>
        <div class="controls">
            <span id="score-display">Score: 0</span>
            <button id="next-btn" class="primary-btn" style="display: none;">Next Question</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
