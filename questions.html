<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor Questions — Daily Trivia Challenge</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- HTML2CANVAS LIBRARY FOR RECEIPT SCREENSHOT CAPTURE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #262626;
            --surface-border-light: #3a3a3a;
            --text-primary: #ffffff;
            --text-muted: #888888;
            --genre-gold: #facc15;
            --genre-gold-glow: rgba(250, 204, 21, 0.35);
            --state-active: #facc15;
            --state-active-glow: rgba(250, 204, 21, 0.3);
            --state-warning: #f97316;
            --state-warning-glow: rgba(249, 115, 22, 0.35);
            --state-error: #ef4444;
            --state-error-glow: rgba(239, 68, 68, 0.3);
            --state-success: #22c55e;
            --state-success-glow: rgba(34, 197, 94, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            overflow: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            flex-grow: 1;
        }

        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--genre-gold);
            color: var(--genre-gold);
        }

        .header-timer {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--state-active);
            letter-spacing: 1px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 4px 12px;
            border-radius: 12px;
            display: none;
        }

        .game-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
            text-align: center;
            flex-shrink: 0;
        }

        .game-logo-gold {
            font-family: 'Anton', sans-serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--genre-gold);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px var(--genre-gold-glow);
            margin-bottom: 4px;
        }

        .game-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .game-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--genre-gold);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .gameplay-header-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 4px;
            text-align: center;
            flex-shrink: 0;
        }

        .gameplay-header-box .game-logo-title {
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            margin-bottom: 1px;
        }

        .gameplay-header-box .game-logo-sub {
            font-size: 0.55rem;
            letter-spacing: 3px;
        }

        #landing-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            padding: 16px 14px;
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            border-radius: 8px;
            margin-top: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .landing-shaft-graphic {
            display: flex;
            flex-direction: column;
            width: 52px;
            height: 140px;
            border: 1px solid var(--surface-border-light);
            border-radius: 8px;
            padding: 6px;
            gap: 3px;
            background-color: #111111;
        }

        .landing-shaft-box {
            flex: 1;
            background-color: #080808;
            border: 1px solid var(--surface-border);
            border-radius: 2px;
        }

        .landing-shaft-graphic .landing-shaft-box { animation: sweepMiddle 1.2s ease-in-out forwards; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(11) { animation: sweepBottomSettle 2.6s ease-in-out forwards; animation-delay: 0.05s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(10) { animation-delay: 0.15s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(9)  { animation-delay: 0.25s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(8)  { animation-delay: 0.35s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(7)  { animation-delay: 0.45s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(6)  { animation-delay: 0.55s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(5)  { animation-delay: 0.65s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(4)  { animation-delay: 0.75s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(3)  { animation-delay: 0.85s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(2)  { animation-delay: 0.95s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(1)  { animation: sweepTopGreen 1.6s ease-in-out forwards; animation-delay: 1.05s; }

        @keyframes sweepMiddle {
            0% { background-color: #080808; border-color: var(--surface-border); box-shadow: none; }
            30% { background-color: var(--genre-gold); border-color: var(--genre-gold); box-shadow: 0 0 10px var(--genre-gold-glow); }
            60%, 100% { background-color: #080808; border-color: var(--surface-border); box-shadow: none; }
        }

        @keyframes sweepTopGreen {
            0% { background-color: #080808; border-color: var(--surface-border); box-shadow: none; }
            20%, 70% { background-color: var(--state-success); border-color: var(--state-success); box-shadow: 0 0 16px var(--state-success-glow); }
            100% { background-color: #080808; border-color: var(--surface-border); box-shadow: none; }
        }

        @keyframes sweepBottomSettle {
            0% { background-color: #080808; border-color: var(--surface-border); box-shadow: none; }
            15% { background-color: var(--genre-gold); border-color: var(--genre-gold); box-shadow: 0 0 10px var(--genre-gold-glow); }
            30%, 80% { background-color: #080808; border-color: var(--surface-border); box-shadow: none; }
            95%, 100% { background-color: var(--genre-gold); border-color: var(--genre-gold); box-shadow: 0 0 8px var(--genre-gold-glow); }
        }

        .landing-challenge-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .btn-start {
            background-color: var(--surface);
            border: 1px solid var(--genre-gold);
            color: var(--genre-gold);
            padding: 11px 26px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-start:hover {
            background-color: var(--genre-gold);
            color: #000000;
            box-shadow: 0 4px 25px var(--genre-gold-glow);
        }

        .hud-sidebar-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: stretch;
            gap: 8px;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .tower-stack {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 44px;
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            border-radius: 8px;
            padding: 4px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .tower-floor {
            height: 6px;
            border: 1px solid var(--surface-border);
            background: #111111;
            transition: all 0.2s ease;
            border-radius: 2px;
        }

        .tower-floor.active { border-color: var(--state-active); background: var(--state-active); box-shadow: 0 0 8px var(--state-active-glow); }
        .tower-floor.completed { border-color: var(--state-success); background: var(--state-success); box-shadow: 0 0 6px var(--state-success-glow); }
        .tower-floor.failed { border-color: var(--state-error); background: var(--state-error); box-shadow: 0 0 6px var(--state-error-glow); }

        .floor-info-box {
            flex-grow: 1;
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .floor-left-group { display: flex; flex-direction: column; gap: 2px; }
        .current-floor-display { font-family: 'Montserrat', sans-serif; font-size: 1rem; font-weight: 800; letter-spacing: 1px; }
        .floor-rule-text { font-family: 'Montserrat', sans-serif; font-size: 0.62rem; font-weight: 700; color: var(--genre-gold); letter-spacing: 0.8px; text-transform: uppercase; }

        .play-card {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            border-radius: 8px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex: 1;
            margin-bottom: 4px;
            overflow: hidden;
            min-height: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .timer-bar-container {
            width: 100%;
            height: 5px;
            background: #111111;
            border: 1px solid var(--surface-border);
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background-color: var(--state-active);
            box-shadow: 0 0 8px var(--state-active-glow);
            transition: width 0.1s linear, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* OPTION BUTTON STYLING FOR QUESTIONS */
        .btn-option {
            width: 100%;
            background-color: #111111;
            border: 1px solid var(--surface-border-light);
            color: #ffffff;
            padding: 12px 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-option:hover {
            border-color: var(--genre-gold);
            background-color: #1a1a1a;
            color: var(--genre-gold);
        }

        .btn-option.selected-correct {
            border-color: var(--state-success) !important;
            background-color: #122417 !important;
            color: var(--state-success) !important;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
        }

        .btn-option.selected-wrong {
            border-color: var(--state-error) !important;
            background-color: #281414 !important;
            color: var(--state-error) !important;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
        }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.92); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.hidden { display: none !important; }
        .modal-card { background-color: var(--surface); border: 1px solid var(--surface-border-light); padding: 24px 20px; border-radius: 14px; width: 90%; max-width: 360px; text-align: center; }
        .modal-large { max-width: 440px; }
        .stats-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 12px 0; background: var(--bg-deep); border: 1px solid var(--surface-border); border-radius: 10px; padding: 12px; }
        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .stat-val { font-size: 1.2rem; font-weight: 800; color: var(--genre-gold); }
        .stat-lbl { font-size: 0.55rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }
        .vault-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 8px; max-height: 200px; overflow-y: auto; margin: 12px 0; }
        .vault-item-btn { background-color: #111111; border: 1px solid var(--surface-border); color: var(--text-primary); padding: 10px 6px; border-radius: 8px; cursor: pointer; text-align: center; }
        .vault-item-btn:hover { border-color: var(--genre-gold); background-color: #1a1a1a; }
        .btn-modal { flex-grow: 1; width: 100%; background-color: #111111; border: 1px solid var(--surface-border-light); color: var(--text-primary); padding: 11px; font-family: 'Montserrat', sans-serif; font-size: 0.78rem; font-weight: 700; border-radius: 24px; cursor: pointer; margin-top: 8px; }

        footer {
            font-size: 0.58rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
            text-align: center;
            flex-shrink: 0;
        }

        /* IN-GAME VICTORY RECEIPT CARD SPECIFICATIONS — QUESTIONS (GOLD THEME) */
        .victory-receipt-card {
            width: 100%;
            max-width: 340px;
            background-color: #111111;
            border: 1px solid var(--genre-gold);
            border-radius: 14px;
            padding: 22px 20px;
            box-shadow: 0 0 25px var(--genre-gold-glow);
            margin-bottom: 16px;
            text-align: left;
            display: block;
        }

        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333333;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .brand-lockup-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-mark-left {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: var(--genre-gold);
            line-height: 0.85;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px var(--genre-gold-glow);
        }

        .brand-text-stacked {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
        }

        .brand-title-top {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .brand-title-bottom {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            color: var(--genre-gold);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .badge-slot-reserved {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: #888888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hero-flex-box {
            text-align: center;
            padding: 4px 0;
            margin-bottom: 16px;
        }

        .game-title-header {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 6px;
        }

        .flex-status-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .brand-gold { color: var(--genre-gold); }
        .brand-green { color: var(--state-success); }
        .brand-white { color: #ffffff; }

        .hero-time-display {
            font-family: 'Anton', sans-serif;
            font-size: 3.4rem;
            line-height: 0.9;
            color: #ffffff;
            letter-spacing: 2px;
            margin: 8px 0;
        }

        .hero-time-unit {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #888888;
            letter-spacing: 1px;
            margin-left: 2px;
            text-transform: lowercase;
        }

        .flex-tier-badge {
            display: inline-block;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--genre-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(250, 204, 21, 0.1);
            border: 1px solid var(--genre-gold);
            padding: 6px 16px;
            border-radius: 12px;
            margin-top: 6px;
        }

        .receipt-details {
            border-top: 1px solid #333333;
            padding-top: 14px;
            margin-bottom: 16px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .receipt-row:last-child {
            margin-bottom: 0;
        }

        .row-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .row-val {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .row-val.success { color: var(--state-success); }
        .row-val.active { color: var(--genre-gold); }

        .card-footer-cta {
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 800;
            color: #888888;
            letter-spacing: 1.5px;
            border-top: 1px dashed #333333;
            padding-top: 10px;
            text-transform: uppercase;
        }

        .controls-group {
            width: 100%;
            max-width: 340px;
            display: block;
        }

        .btn-flex-action {
            width: 100%;
            background-color: var(--genre-gold);
            border: 1px solid var(--genre-gold);
            color: #000000;
            padding: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--genre-gold-glow);
            margin-bottom: 10px;
            display: block;
        }

        .btn-secondary-action {
            width: 100%;
            background-color: #111111;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 24px;
            cursor: pointer;
            display: block;
        }

        #toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--genre-gold);
            color: #000000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 8px 16px;
            border-radius: 20px;
            display: none;
            z-index: 1000;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="game-questions">

    <div class="main-wrapper">
        <div class="top-bar">
            <a href="index.html" class="pill-btn">← LOBBY</a>
            <button class="pill-btn" id="btn-sound-toggle">SOUND: ON</button>
        </div>

        <!-- LANDING SCREEN -->
        <div id="landing-screen">
            <div class="game-logo-box">
                <h1 class="game-logo-gold">11FL?</h1>
                <p class="game-logo-title">Eleventh Floor</p>
                <p class="game-logo-sub">QUESTIONS</p>
            </div>

            <div class="landing-container">
                <div class="landing-shaft-graphic">
                    <div class="landing-shaft-box"></div>
                    <div class="landing-shaft-box"></div>
                    <div class="landing-shaft-box"></div>
                    <div class="landing-shaft-box"></div>
                    <div class="landing-shaft-box"></div>
                    <div class="landing-shaft-box"></div>
                    <div class="landing-shaft-box"></div>
                    <div class="landing-shaft-box"></div>
                    <div class="landing-shaft-box"></div>
                    <div class="landing-shaft-box"></div>
                    <div class="landing-shaft-box"></div>
                </div>

                <div class="landing-challenge-text">
                    <strong>CAN YOU REACH THE 11TH FLOOR?</strong><br><br>
                    Answer one trivia question on each floor before time runs out. One mistake or missed timer resets you back to the ground floor.
