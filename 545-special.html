<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5.45 Special - 11th Floor Games</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent-green: #22c55e;
      --accent-green-hover: #16a34a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --gold: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      text-transform: uppercase;
    }

    .brand-logo span.green-highlight {
      color: var(--accent-green);
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    h1, h2, h3 {
      margin-bottom: 12px;
    }

    p {
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .pill-btn {
      background-color: transparent;
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-block;
      margin-bottom: 16px;
    }

    .pill-btn:hover {
      background-color: var(--accent-green);
      color: var(--bg-dark);
    }

    .mode-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      background-color: #273549;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      text-align: center;
    }

    .btn:hover {
      border-color: var(--accent-green);
      background-color: #31435e;
    }

    .btn-primary {
      background-color: var(--accent-green);
      color: #000000;
      border: none;
    }

    .btn-primary:hover {
      background-color: var(--accent-green-hover);
    }

    .btn.selected {
      border-color: var(--accent-green);
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      text-align: left;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--text-main);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .rules-section {
      margin-bottom: 20px;
    }

    .rules-section h3 {
      color: var(--accent-green);
      font-size: 1rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .rules-section ul {
      list-style-type: disc;
      padding-left: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .rules-section li {
      margin-bottom: 6px;
    }

    /* Game HUD & Play Area */
    .game-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .hud-value {
      color: var(--accent-green);
      font-size: 1.1rem;
    }

    .timer-danger {
      color: var(--danger) !important;
    }

    .question-card {
      text-align: left;
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-main);
      line-height: 1.4;
    }

    .answers-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .answer-btn {
      background-color: #273549;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .answer-btn:hover {
      border-color: var(--accent-green);
      background-color: #31435e;
    }

    .answer-btn.correct {
      background-color: rgba(34, 197, 94, 0.2) !important;
      border-color: var(--accent-green) !important;
      color: var(--accent-green) !important;
    }

    .answer-btn.incorrect {
      background-color: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--danger) !important;
      color: var(--danger) !important;
    }

    .hidden {
      display: none !important;
    }

    footer {
      margin-top: auto;
      padding: 24px 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-logo">
        <span class="green-highlight">5.45</span> SPECIAL
      </div>
      <div class="brand-subtitle">11th Floor Games</div>
    </header>

    <!-- LANDING VIEW -->
    <div id="landing-view" class="card">
      <h2>The Ultimate Football Quiz</h2>
      <p>50 quickfire questions testing your football knowledge across 51 floors of skyscraper challenge.</p>
      
      <button class="pill-btn" onclick="openRulesModal()">HOW TO PLAY</button>

      <div class="mode-options">
        <button id="btn-mode-standard" class="btn selected" onclick="selectMode('standard')">STANDARD MODE</button>
        <button id="btn-mode-gaffer" class="btn" onclick="selectMode('gaffer')">GAFFER MODE</button>
        <button id="btn-mode-group" class="btn" onclick="selectMode('group')">GROUP PLAY (Unlimited)</button>
      </div>

      <div style="margin-top: 24px;">
        <button class="btn btn-primary" onclick="startSkyscraperGame()">START CHALLENGE</button>
      </div>
    </div>

    <!-- GAMEPLAY VIEW -->
    <div id="gameplay-view" class="hidden">
      <div class="game-hud">
        <div class="hud-item">
          <span class="hud-label">Floor</span>
          <span id="hud-floor" class="hud-value">1 / 51</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Score</span>
          <span id="hud-score" class="hud-value">0</span>
