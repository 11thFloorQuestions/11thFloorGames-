<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor Word Climb — Daily Puzzle</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- HTML2CANVAS LIBRARY FOR RECEIPT SCREENSHOT CAPTURE -->

    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #222222;
            --surface-border-light: #333333;
            --text-primary: #ffffff;
            --text-muted: #888888;
            --genre-cyan: #00f0ff;
            --genre-cyan-glow: rgba(0, 240, 255, 0.35);
            --brand-red: #cc0000;
            --brand-red-glow: rgba(204, 0, 0, 0.35);
            --state-active: #facc15;
            --state-active-glow: rgba(250, 204, 21, 0.3);
            --state-success: #22c55e;
            --state-success-glow: rgba(34, 197, 94, 0.3);
            --state-error: #ef4444;
            --state-error-glow: rgba(239, 68, 68, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: var(--bg-deep);
            height: 100%;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            overflow: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            min-height: 100dvh;
            flex-grow: 1;
        }

        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--genre-cyan);
            color: var(--genre-cyan);
        }

        /* Header Timer Display */
        .header-timer {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--state-active);
            letter-spacing: 1px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 4px 12px;
            border-radius: 12px;
            display: none;
        }

        /* Landing Logo Box */
        .game-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
            text-align: center;
            flex-shrink: 0;
        }

        .game-logo-cyan {
            font-family: 'Anton', sans-serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--genre-cyan);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px var(--genre-cyan-glow);
            margin-bottom: 4px;
        }

        .game-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .game-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--genre-cyan);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Gameplay Compact Header Box */
        .gameplay-header-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 4px;
            text-align: center;
            flex-shrink: 0;
        }

        .gameplay-header-box .game-logo-title {
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            margin-bottom: 1px;
        }

        .gameplay-header-box .game-logo-sub {
            font-size: 0.55rem;
            letter-spacing: 3px;
        }

        #start-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }

        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            padding: 16px 14px;
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            border-radius: 8px;
            margin-top: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .landing-shaft-graphic {
            display: flex;
            flex-direction: column;
            width: 52px;
            height: 140px;
            border: 1px solid var(--surface-border-light);
            border-radius: 8px;
            padding: 6px;
            gap: 3px;
            background-color: #111111;
        }

            flex: 1;
            background-color: #08080
