    <style>
        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .pill-btn {
            background: var(--surface, #0a0a0a);
            border: 1px solid var(--surface-border-light, #333333);
            color: var(--text-primary, #ffffff);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--genre-blue, #3B82F6);
            color: var(--genre-blue, #3B82F6);
        }

        /* Active Timer Display */
        .header-timer {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--state-active, #facc15);
            letter-spacing: 1px;
            background: var(--surface, #0a0a0a);
            border: 1px solid var(--surface-border, #222222);
            padding: 4px 12px;
            border-radius: 12px;
            display: none;
        }

        .landing-shaft-graphic .landing-shaft-box:nth-child(9)  { animation-delay: 0.25s; }
